<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>县城转盘示意图</title>
<style>body{margin:0;background:#fbf8f3}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" font-family="WenQuanYi Zen Hei, sans-serif">
  <rect width="1000" height="780" fill="#fbf8f3"/>
  <text x="500" y="44" text-anchor="middle" font-size="28" fill="#3a3a3a" font-weight="bold">县城转盘示意图</text>

  <g stroke="#b9b4ab" stroke-width="54" stroke-linecap="butt">
    <line x1="500" y1="380" x2="0" y2="380"/>
    <line x1="500" y1="380" x2="265" y2="70"/>
    <line x1="500" y1="380" x2="745" y2="70"/>
    <line x1="500" y1="380" x2="1000" y2="360"/>
    <line x1="500" y1="380" x2="535" y2="780"/>
  </g>
  <g stroke="#fff" stroke-width="3" stroke-dasharray="16 12">
    <line x1="400" y1="380" x2="0" y2="380"/>
    <line x1="440" y1="301" x2="265" y2="70"/>
    <line x1="560" y1="301" x2="745" y2="70"/>
    <line x1="600" y1="376" x2="1000" y2="360"/>
    <line x1="509" y1="480" x2="535" y2="780"/>
  </g>

  <circle cx="500" cy="380" r="100" fill="#b9b4ab"/>
  <circle cx="500" cy="380" r="52" fill="#9fc68f" stroke="#fff" stroke-width="3"/>
  <text x="500" y="387" text-anchor="middle" font-size="20" fill="#2f4a28">转盘</text>
  <circle cx="500" cy="380" r="76" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="10 8"/>

  <g font-size="24" font-weight="bold" fill="#c0392b">
    <text x="24" y="340">县西 ←</text>
    <text x="220" y="112" text-anchor="end">↖ 高速</text>
    <text x="790" y="112">市里 ↗</text>
    <text x="976" y="332" text-anchor="end">→ 县东</text>
    <text x="585" y="760">↓ 县城中心</text>
  </g>

  <g font-size="18" fill="#333">
    <rect x="70" y="232" width="130" height="80" rx="8" fill="#f6d7b0" stroke="#c98a3c" stroke-width="2"/>
    <text x="135" y="266" text-anchor="middle" font-weight="bold">张守宁</text>
    <text x="135" y="292" text-anchor="middle">现住址</text>

    <rect x="245" y="232" width="130" height="80" rx="8" fill="#f3e6a6" stroke="#b89a2a" stroke-width="2"/>
    <text x="310" y="266" text-anchor="middle" font-weight="bold">大姨家</text>
    <text x="310" y="292" text-anchor="middle" font-size="15">（原住址马路对面）</text>

    <rect x="170" y="428" width="140" height="80" rx="8" fill="#cfe0f2" stroke="#4a79a8" stroke-width="2"/>
    <text x="240" y="462" text-anchor="middle" font-weight="bold">张守宁</text>
    <text x="240" y="488" text-anchor="middle">原住小区</text>

    <rect x="330" y="470" width="135" height="140" rx="8" fill="#e6d3ec" stroke="#8a5a9c" stroke-width="2"/>
    <text x="397" y="535" text-anchor="middle" font-weight="bold" font-size="22">酒店</text>
    <text x="397" y="562" text-anchor="middle" font-size="14">县西 × 县城中心</text>
    <text x="397" y="580" text-anchor="middle" font-size="14">路口</text>
  </g>

  <path d="M290 322 L290 438" stroke="#777" stroke-width="2" stroke-dasharray="4 5" marker-start="url(#a)" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#777"/></marker></defs>
  <text x="298" y="420" font-size="13" fill="#555">马路对面</text>
  <path d="M245 272 L205 272" stroke="#888" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="170" y="222" font-size="13" fill="#777">← 往路的尽头方向</text>
</svg>
</body></html>
